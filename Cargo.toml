[package]
name = "ac_rust_lib"
version = "0.1.0"
edition = "2021"
description = "AtCoder 用の自作ライブラリ（main.rs テンプレート / rust.json スニペットを整理したもの）"

[lib]
path = "src/lib.rs"

# AtCoder 2023 言語アップデート時点のバージョンに合わせている
[dependencies]
ac-library-rs = "=0.1.1"
proconio = { version = "=0.4.5", features = ["derive"] }
itertools = "=0.11.0"
superslice = "=1.0.0"
